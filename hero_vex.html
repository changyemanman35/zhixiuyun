<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VEX — Shaping tomorrow with vision and action.</title>
  <!-- Google Font: Inter (CRITICAL) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000000; color: #ffffff;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ══════════════════════════════════════════════
       LIQUID GLASS CSS (USER SPEC)
       ══════════════════════════════════════════════ */
    .liquid-glass {
      background: rgba(0, 0, 0, 0.4);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.1) 80%, rgba(255,255,255,0.3) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Fullscreen Hero Layout */
    .hero-container {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000000;
    }

    /* Background Video: Raw with no dimming whatsoever */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Navbar Wrapper */
    .navbar-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 24px 24px 0 24px;
    }
    @media (min-width: 768px) { .navbar-wrapper { padding: 24px 48px 0 48px; } }
    @media (min-width: 1024px) { .navbar-wrapper { padding: 24px 64px 0 64px; } }

    .navbar {
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-decoration: none;
    }
    .nav-links {
      display: none;
      align-items: center;
      gap: 32px;
    }
    @media (min-width: 768px) { .nav-links { display: flex; } }

    .nav-link {
      font-size: 14px;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link:hover { color: #d1d5db; }

    .btn-chat-sm {
      background: #ffffff;
      color: #000000;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn-chat-sm:hover { background: #f3f4f6; }

    /* Content Area pushed to bottom */
    .hero-content {
      position: relative;
      z-index: 10;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 24px 48px 24px;
    }
    @media (min-width: 768px) { .hero-content { padding: 0 48px 48px 48px; } }
    @media (min-width: 1024px) { .hero-content { padding: 0 64px 64px 64px; } }

    .hero-grid {
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 1024px) {
      .hero-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: flex-end;
        gap: 32px;
      }
    }

    /* Heading Character Animation */
    .hero-heading {
      font-size: clamp(36px, 5.5vw, 72px);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin: 0 0 16px 0;
      color: #ffffff;
    }
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateX(-18px);
      transition: opacity 500ms ease-out, transform 500ms ease-out;
    }
    .char.active {
      opacity: 1;
      transform: translateX(0);
    }

    /* Fade-in Blocks */
    .fade-in {
      opacity: 0;
      transition: opacity 1000ms ease-out;
    }
    .fade-in.active { opacity: 1; }

    .hero-sub {
      font-size: clamp(16px, 1.2vw, 18px);
      color: #d1d5db;
      margin: 0 0 20px 0;
      max-width: 580px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .btn-chat-lg {
      background: #ffffff;
      color: #000000;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.2s;
    }
    .btn-chat-lg:hover { background: #f3f4f6; transform: translateY(-1px); }

    .btn-explore {
      border: 1px solid rgba(255,255,255,0.2) !important;
      color: #ffffff;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-explore:hover {
      background: #ffffff !important;
      color: #000000 !important;
    }

    .tag-container {
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      margin-top: 32px;
    }
    @media (min-width: 1024px) {
      .tag-container {
        justify-content: flex-end;
        margin-top: 0;
      }
    }

    .tag-card {
      border: 1px solid rgba(255,255,255,0.2) !important;
      padding: 12px 24px;
      border-radius: 12px;
      user-select: none;
    }
    .tag-text {
      font-size: clamp(18px, 1.6vw, 24px);
      font-weight: 300;
      color: #ffffff;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <!-- Raw Background Video: No overlay, no gradient -->
    <video
      class="hero-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260403_050628_c4e32401-fab4-4a27-b7a8-6e9291cd5959.mp4"
      autoplay
      loop
      muted
      playsinline
    ></video>

    <!-- Hero Content pushed to bottom (Navbar removed as requested) -->

    <!-- Hero Content pushed to bottom -->
    <main class="hero-content">
      <div class="hero-grid">
        <!-- Left Column -->
        <div>
          <h1 class="hero-heading" id="heading">
            <!-- Populated via script for 30ms character delay -->
            Shaping tomorrow<br>with vision and action.
          </h1>

          <div class="fade-in" id="subheading">
            <p class="hero-sub">
              We back visionaries and craft ventures that define what comes next.
            </p>
          </div>

          <div class="fade-in" id="buttons">
            <div class="btn-row">
              <a href="#chat" class="btn-chat-lg">Start a Chat</a>
              <a href="#explore" class="btn-explore liquid-glass">Explore Now</a>
            </div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="tag-container">
          <div class="fade-in" id="tag">
            <div class="tag-card liquid-glass">
              <span class="tag-text">Investing. Building. Advisory.</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      var raw = "Shaping tomorrow\nwith vision and action.";
      var el = document.getElementById('heading');
      if (!el) return;

      var lines = raw.split('\n');
      var charDelay = 30; // ms
      var initialDelay = 200; // ms
      var chars = [];

      el.innerHTML = '';
      lines.forEach(function(line, lineIndex) {
        var row = document.createElement('div');
        row.style.display = 'block';

        for (var i = 0; i < line.length; i++) {
          var c = line[i];
          var span = document.createElement('span');
          span.className = 'char';
          span.textContent = c === ' ' ? '\u00A0' : c;

          var delay = (lineIndex * line.length * charDelay) + (i * charDelay);
          span.style.transitionDelay = delay + 'ms';

          row.appendChild(span);
          chars.push(span);
        }
        el.appendChild(row);
      });

      // 1. Initial 200ms delay character fly-in
      setTimeout(function() {
        chars.forEach(function(s) { s.classList.add('active'); });
      }, initialDelay);

      // 2. Subheading at 800ms
      setTimeout(function() {
        var sub = document.getElementById('subheading');
        if (sub) sub.classList.add('active');
      }, 800);

      // 3. Buttons at 1200ms
      setTimeout(function() {
        var btns = document.getElementById('buttons');
        if (btns) btns.classList.add('active');
      }, 1200);

      // 4. Tag at 1400ms
      setTimeout(function() {
        var tag = document.getElementById('tag');
        if (tag) tag.classList.add('active');
      }, 1400);
    })();
  </script>
</body>
</html>
